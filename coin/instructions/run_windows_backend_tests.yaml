type: Group
enable_if:
  condition: property
  property: features
  contains_value: WindowsNativeMediaBackendTests

instructions:
  - type: EnvironmentVariable
    variableName: QT_MEDIA_BACKEND
    variableValue: windows

  - type: AppendToEnvironmentVariable
    variableName: CTEST_ARGS
    variableValue: " -L media-backend"

  - !include "{{qt/qtbase}}/coin_module_test_template_v3.yaml"
