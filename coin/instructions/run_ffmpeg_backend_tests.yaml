type: Group
disable_if:
  condition: or
  conditions:
    - condition: runtime
      env_var: TARGET_OS_COIN
      equals_value: qnx
    - condition: runtime
      env_var: TARGET_OSVERSION_COIN
      equals_value: vxworks
      # Only run tests for the darwin/avfoundation backend.
    - condition: property
      property: features
      contains_value: DarwinNativeMediaBackendTests
      # Only run tests for the windows media foundation backend.
    - condition: property
      property: features
      contains_value: WindowsNativeMediaBackendTests
instructions:
  - type: EnvironmentVariable
    variableName: QT_MEDIA_BACKEND
    variableValue: ffmpeg
  - !include "{{qt/qtbase}}/coin_module_test_template_v3.yaml"
