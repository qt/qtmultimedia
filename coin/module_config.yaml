version: 2
accept_configuration:
  condition: property
  property: features
  not_contains_value: Disable

instructions:
  Build:
    - !include "{{qt/qtmultimedia}}/configure_tests_environment_for_ffmpeg_backend.yaml"
    - type: EnvironmentVariable
      variableName: VERIFY_SOURCE_SBOM
      variableValue: "ON"
    - !include "{{qt/qtbase}}/coin_module_build_template_v2.yaml"

  Test:
    - !include "{{qt/qtmultimedia}}/run_ffmpeg_backend_tests.yaml"
    - type: Group
      instructions:
        - !include "{{qt/qtmultimedia}}/run_pipewire_backend_tests.yaml"
      # Run tests without LicenseCheckV2, which was already executed
      disable_if:
        condition: property
        property: features
        contains_value: LicenseCheckV2
    - !include "{{qt/qtbase}}/coin_module_test_docs.yaml"
