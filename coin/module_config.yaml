version: 2
accept_configuration:
  condition: property
  property: features
  not_contains_value: Disable

instructions:
  Build:
    # In Qt Multimedia we want CI to always build manual tests to avoid bitrot.
    - type: AppendToEnvironmentVariable
      variableName: COMMON_TEST_CMAKE_ARGS
      variableValue: " -DQT_BUILD_MANUAL_TESTS=ON"

    - !include "{{qt/qtmultimedia}}/configure_tests_environment_for_ffmpeg_backend.yaml"
    - type: EnvironmentVariable
      variableName: VERIFY_SOURCE_SBOM
      variableValue: "ON"
    - !include "{{qt/qtbase}}/coin_module_build_template_v2.yaml"

  Test:
    - !include "{{qt/qtmultimedia}}/configure_tests_environment_for_ffmpeg_backend.yaml"

    # Hosts with a media backend test feature run only that backend's tests.
    - type: Group
      instructions:
        - !include "{{qt/qtmultimedia}}/run_darwin_backend_tests.yaml"
      enable_if:
        condition: property
        property: features
        contains_value: DarwinNativeMediaBackendTests

    - type: Group
      instructions:
        - !include "{{qt/qtmultimedia}}/run_windows_backend_tests.yaml"
      enable_if:
        condition: property
        property: features
        contains_value: WindowsNativeMediaBackendTests

    - type: Group
      instructions:
        - !include "{{qt/qtmultimedia}}/run_ffmpeg_backend_tests.yaml"
        - !include "{{qt/qtmultimedia}}/run_pipewire_camera_tests.yaml"
        - !include "{{qt/qtbase}}/coin_module_test_docs.yaml"
      enable_if:
        condition: and
        conditions:
          - condition: property
            property: features
            not_contains_value: DarwinNativeMediaBackendTests
          - condition: property
            property: features
            not_contains_value: WindowsNativeMediaBackendTests
